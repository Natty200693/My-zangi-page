<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fãs de Tony Carreira</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 12px;
      font-size: 28px;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }

    .button {
      display: inline-block;
      padding: 15px 25px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Fãs de Tony Carreira</h1>

    <p>Converse comigo no Zangi</p>

    <a class="button"
       href="https://play.google.com/store/apps/details?id=com.beint.zangi"
       target="_blank">
      Baixar Zangi
    </a>

    <p>Mensagem no Zangi:</p>

    <div class="number">7726983670</div>
  </div>
</body>
</html>
